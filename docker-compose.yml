services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    networks: [control]

  postgres1:
    build: ./infra/patroni
    hostname: postgres1
    environment:
      PATRONI_NAME: postgres1
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres1:5432
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERPASS:-postgres}
      PATRONI_REPLICATION_PASSWORD: replicator
      PATRONI_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-app}
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
    ports:
      - "8008:8008"
    volumes:
      - pg1-data:/var/lib/postgresql/data
    depends_on: [etcd]
    networks: [control, db]

  postgres2:
    build: ./infra/patroni
    hostname: postgres2
    environment:
      PATRONI_NAME: postgres2
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres2:5432
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERPASS:-postgres}
      PATRONI_REPLICATION_PASSWORD: replicator
      PATRONI_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-app}
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
    ports:
      - "8009:8008"
    volumes:
      - pg2-data:/var/lib/postgresql/data
    depends_on: [etcd]
    networks: [control, db]

  haproxy:
    image: haproxy:3.0-alpine
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"
      - "8404:8404"
    depends_on: [postgres1, postgres2]
    networks: [db, app]

  demo-api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_APP_PASSWORD:-app}@haproxy:5432/citylab
      LOKI_URL: http://loki:3100
      ENVIRONMENT: hybrid-lab
    ports:
      - "8080:8080"
    depends_on: [haproxy, loki]
    networks: [app, observability]

  db-metrics:
    build: ./observability/db-metrics
    environment:
      PG1_DSN: postgresql://postgres:${POSTGRES_SUPERPASS:-postgres}@postgres1:5432/postgres
      PG2_DSN: postgresql://postgres:${POSTGRES_SUPERPASS:-postgres}@postgres2:5432/postgres
      PATRONI1_URL: http://postgres1:8008/patroni
      PATRONI2_URL: http://postgres2:8008/patroni
    ports:
      - "9105:9105"
    depends_on: [postgres1, postgres2]
    networks: [db, control, observability]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [observability]

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [observability]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki]
    networks: [observability]

  dashboard:
    build: ./dashboard
    environment:
      DASHBOARD_API_TOKEN: ${DASHBOARD_API_TOKEN:-changeme-token}
    volumes:
      - ./analysis:/workspace/analysis:ro
      - ./experiments:/workspace/experiments
      - ./site:/workspace/site
    ports:
      - "8000:8000"
    networks: [app]

  k6:
    image: grafana/k6:0.57.0
    profiles: [tools]
    volumes:
      - ./workload/k6:/scripts:ro
      - ./experiments:/experiments
    environment:
      BASE_URL: http://demo-api:8080
      RUN_ID: ${RUN_ID:-manual}
    networks: [app]

networks:
  control:
  db:
  app:
  observability:

volumes:
  etcd-data:
  pg1-data:
  pg2-data:
  prometheus-data:
  loki-data:
  grafana-data:
